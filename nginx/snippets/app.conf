root /usr/share/nginx/html;
index index.html;
client_max_body_size 21m;
server_tokens off;
proxy_read_timeout 60s;
# Original files need per-child authorization. Never serve this volume statically.
location ^~ /local-documents/ { return 403; }
location = /local-documents { return 403; }
location ^~ /internal/ { return 404; }
location = /internal { return 404; }
location ^~ /api/v1/ { return 404; }
location = /api/v1 { return 404; }
location = /api { include /etc/nginx/snippets/proxy.conf; }
# Current chat is synchronous JSON, not SSE. Only slow AI routes get a longer timeout.
location ~ ^/api/(ai-chat-sessions/[^/]+/messages|welfare-explanations)$ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 360s;
}
location /api/ { include /etc/nginx/snippets/proxy.conf; }
location /oauth2/ { include /etc/nginx/snippets/proxy.conf; }
location /login/oauth2/ { include /etc/nginx/snippets/proxy.conf; }
location = /logout { include /etc/nginx/snippets/proxy.conf; }
location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache" always; }
location = /manifest.webmanifest { try_files $uri =404; add_header Cache-Control "no-cache" always; }
location = /index.html { try_files $uri =404; add_header Cache-Control "no-cache" always; }
location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache" always; }
location ~* \.(js|css|json|webmanifest|png|jpg|jpeg|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
