server {
    listen 80 default_server;
    server_name __DOMAIN__;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 308 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != __DOMAIN__) { return 444; }
    proxy_cookie_flags DODAM_TOKEN secure httponly samesite=lax;
    proxy_cookie_flags DODAM_SESSION secure httponly samesite=lax;
    include /etc/nginx/snippets/app.conf;
}
