name: Release images
on:
  pull_request:
    paths:
      - '.github/workflows/release-images.yml'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Unique release name, for example 20261116-rx'
        required: true
        type: string
      web_sha:
        description: Frontend commit SHA (40 hexadecimal characters)
        required: true
        type: string
      backend_sha:
        description: Spring Boot commit SHA (40 hexadecimal characters)
        required: true
        type: string
      ai_sha:
        description: FastAPI commit SHA (40 hexadecimal characters)
        required: true
        type: string
      publish:
        description: Push the images to Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/choihwanwoo1234/dodam-web

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            repository: Dodam_frontend
            dockerfile: frontend.Dockerfile
            input: web_sha
            smoke_sha: 9c42c1dc58875648ed641290b9deb72aa5cc4170
          - service: backend
            repository: Dodam_backend
            dockerfile: backend.Dockerfile
            input: backend_sha
            smoke_sha: b0f90aead3c131a1380e9f2def6b65c8771d3426
          - service: ai
            repository: Dodam_AI_backend
            dockerfile: ai.Dockerfile
            input: ai_sha
            smoke_sha: 025c1354f73d809ec57b1bb8b483fda88754b31f
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out exact source revision
        id: source
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ matrix.repository }}
          REQUESTED_SHA: ${{ inputs[matrix.input] || matrix.smoke_sha }}
          RELEASE: ${{ inputs.release || 'pr-build' }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The source revision must be a 40-character lowercase commit SHA."
            exit 1
          fi
          if [[ ! "$RELEASE" =~ ^[a-z0-9][a-z0-9._-]{0,70}$ ]]; then
            echo "::error::Use a unique release name with lowercase letters, digits, dots, underscores or hyphens."
            exit 1
          fi
          git init -q source
          git -C source fetch --no-tags --depth=1 "https://github.com/ieum-connect/$REPOSITORY.git" "$REQUESTED_SHA"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$REQUESTED_SHA"
          {
            printf 'sha=%s\n' "$REQUESTED_SHA"
            printf 'tag=%s:%s-%s-%s-%s\n' "$IMAGE_REPOSITORY" "$SERVICE" "$RELEASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v4
        with:
          username: choihwanwoo1234
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./source
          file: ./docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ steps.source.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          provenance: false
          sbom: false

      - name: Record published digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s %s %s\n' "$SERVICE" "$DIGEST" "$SHA" > "$SERVICE.txt"
          printf '%s: `%s` → `%s@%s`\n' "$SERVICE" "$SHA" "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: digest-${{ matrix.service }}
          path: ${{ matrix.service }}.txt
          if-no-files-found: error

  manifest:
    name: Collect image digests
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - run: cat backend.txt ai.txt web.txt > image-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.txt
          if-no-files-found: error
